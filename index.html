<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 30px 24px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .input-area {
            padding: 24px;
            border-bottom: 1px solid #eee;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .char-count {
            font-size: 13px;
            color: #888;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .message-list {
            padding: 20px 24px 24px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .list-header h2 {
            font-size: 18px;
            color: #333;
        }

        .count-badge {
            background: #667eea;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }

        .message-item {
            background: #fafbff;
            border-left: 4px solid #667eea;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-content {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 8px;
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }

        .delete-btn {
            background: transparent;
            color: #e74c3c;
            padding: 4px 10px;
            font-size: 12px;
            border: 1px solid #e74c3c;
            border-radius: 6px;
        }

        .delete-btn:hover {
            background: #e74c3c;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 留言板</h1>
            <p>写下你想说的话，数据保存在本地浏览器中</p>
        </header>

        <div class="input-area">
            <textarea id="messageInput" placeholder="请输入留言内容..." maxlength="500"></textarea>
            <div class="actions">
                <span class="char-count"><span id="charCount">0</span>/500</span>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="clearInput()">清空</button>
                    <button class="btn-primary" onclick="saveMessage()">保存留言</button>
                </div>
            </div>
        </div>

        <div class="message-list">
            <div class="list-header">
                <h2>全部留言 <span class="count-badge" id="countBadge">0</span></h2>
                <button class="btn-secondary" onclick="clearAll()">清空全部</button>
            </div>
            <div id="messageContainer"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'my_guestbook_messages';

        // 获取所有留言
        function getMessages() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 保存留言到 localStorage
        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        // 保存一条新留言
        function saveMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content) {
                showToast('留言内容不能为空！');
                return;
            }

            const messages = getMessages();
            const newMessage = {
                id: Date.now(),
                content: content,
                time: new Date().toLocaleString('zh-CN')
            };

            messages.unshift(newMessage); // 新留言置顶
            saveMessages(messages);
            input.value = '';
            updateCharCount();
            renderMessages();
            showToast('留言保存成功 ✨');
        }

        // 删除单条留言
        function deleteMessage(id) {
            if (!confirm('确定要删除这条留言吗？')) return;

            let messages = getMessages();
            messages = messages.filter(m => m.id !== id);
            saveMessages(messages);
            renderMessages();
            showToast('已删除');
        }

        // 清空所有留言
        function clearAll() {
            const messages = getMessages();
            if (messages.length === 0) {
                showToast('当前没有留言');
                return;
            }
            if (!confirm('确定要清空全部留言吗？此操作不可恢复！')) return;

            saveMessages([]);
            renderMessages();
            showToast('已全部清空');
        }

        // 清空输入框
        function clearInput() {
            document.getElementById('messageInput').value = '';
            updateCharCount();
        }

        // 更新字数统计
        function updateCharCount() {
            const len = document.getElementById('messageInput').value.length;
            document.getElementById('charCount').textContent = len;
        }

        // 渲染留言列表
        function renderMessages() {
            const messages = getMessages();
            const container = document.getElementById('messageContainer');
            const badge = document.getElementById('countBadge');
            badge.textContent = messages.length;

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">💭</div>
                        <p>还没有留言，快来写下第一条吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(m => `
                <div class="message-item">
                    <div class="message-content">${escapeHtml(m.content)}</div>
                    <div class="message-meta">
                        <span>🕒 ${m.time}</span>
                        <button class="delete-btn" onclick="deleteMessage(${m.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // HTML 转义，防止 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 提示消息
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 初始化
        document.getElementById('messageInput').addEventListener('input', updateCharCount);
        renderMessages();
    </script>
</body>
</html>
